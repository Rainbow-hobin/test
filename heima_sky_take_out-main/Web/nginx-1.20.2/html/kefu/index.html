<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苍穹外卖 · 商家客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
  .hidden { display: none !important; }

  /* 登录 */
  #login-mask {
    position: fixed; inset: 0; background: linear-gradient(135deg, #ff7a45, #ff4d4f);
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: #fff; border-radius: 14px; padding: 36px 32px;
    width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,.2);
  }
  .login-card h1 { font-size: 22px; margin-bottom: 4px; }
  .login-card p { font-size: 13px; color: #999; margin-bottom: 24px; }
  .login-card input {
    width: 100%; border: 1px solid #e5e5e5; border-radius: 8px;
    padding: 11px 12px; font-size: 14px; margin-bottom: 14px; outline: none;
  }
  .login-card input:focus { border-color: #ff7a45; }
  .login-card button {
    width: 100%; border: none; border-radius: 8px; background: #ff7043;
    color: #fff; font-size: 15px; padding: 11px; cursor: pointer;
  }
  .login-card button:active { background: #e85d30; }
  .login-err { color: #f5222d; font-size: 12px; min-height: 18px; margin-bottom: 6px; }

  /* 主界面 */
  #app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    height: 56px; background: #fff; border-bottom: 1px solid #e8e8e8;
    display: flex; align-items: center; padding: 0 20px; flex-shrink: 0;
  }
  .topbar .logo { font-size: 17px; font-weight: 700; color: #ff7043; }
  .topbar .logo small { color: #999; font-weight: 400; margin-left: 8px; font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .conn-dot { font-size: 12px; color: #999; margin-right: 16px; }
  .conn-dot::before {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #52c41a; margin-right: 5px; vertical-align: 1px;
  }
  .conn-dot.offline::before { background: #f5222d; }
  .emp-name { font-size: 13px; color: #666; margin-right: 14px; }
  .btn-logout {
    border: 1px solid #ddd; background: #fff; border-radius: 6px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; color: #666;
  }

  .main { flex: 1; min-height: 0; display: flex; padding: 16px; gap: 16px; }
  .sider {
    width: 280px; background: #fff; border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.05); flex-shrink: 0;
  }
  .sider-head { padding: 16px; font-weight: 600; border-bottom: 1px solid #f2f2f2; flex-shrink: 0; }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv {
    display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer;
    border-bottom: 1px solid #f7f7f7;
  }
  .conv:hover { background: #fafafa; }
  .conv.active { background: #fff4ef; }
  .conv-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #e6f4ff; color: #1677ff;
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .conv-main { flex: 1; min-width: 0; }
  .conv-line1 { display: flex; justify-content: space-between; }
  .conv-name { font-size: 14px; font-weight: 600; }
  .conv-time { font-size: 11px; color: #bbb; }
  .conv-line2 { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 6px; }
  .conv-last { font-size: 12px; color: #999; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
  .conv-badge {
    background: #f5222d; color: #fff; font-size: 11px; border-radius: 9px;
    min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 5px; flex-shrink: 0;
  }
  .sider-empty { text-align: center; color: #bbb; font-size: 13px; padding: 40px 0; }

  .chat {
    flex: 1; min-width: 0; background: #fff; border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .chat-head {
    padding: 14px 20px; border-bottom: 1px solid #f2f2f2; font-weight: 600; flex-shrink: 0;
  }
  .chat-head small { font-weight: 400; color: #999; margin-left: 8px; }
  .chat-msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; background: #f5f6f8; }
  .chat-tip { text-align: center; color: #bbb; font-size: 13px; margin-top: 30px; }
  .msg-row { display: flex; margin-bottom: 16px; }
  .msg-row.me { justify-content: flex-end; }
  .msg-ava {
    width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 1px solid #eee;
    display: flex; align-items: center; justify-content: center; font-size: 19px; margin-right: 9px; flex-shrink: 0;
  }
  .msg-col { max-width: 66%; display: flex; flex-direction: column; }
  .me .msg-col { align-items: flex-end; }
  .msg-time { font-size: 10px; color: #bbb; margin-bottom: 3px; }
  .bubble { padding: 9px 13px; border-radius: 10px; font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
  .other .bubble { background: #fff; border-top-left-radius: 2px; }
  .me .bubble { background: #ff7043; color: #fff; border-top-right-radius: 2px; }
  .bubble.sending { opacity: .6; }
  .order-card {
    width: 230px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }
  .me .order-card { background: #fff3ed; }
  .oc-h { background: #f7f7f7; padding: 7px 11px; font-size: 12px; color: #666; }
  .oc-n { padding: 8px 11px 4px; font-size: 12px; word-break: break-all; }
  .oc-f { display: flex; justify-content: space-between; padding: 4px 11px 9px; font-size: 12px; color: #888; }
  .oc-f b { color: #ff7043; font-size: 15px; }

  .chat-bar { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #f2f2f2; flex-shrink: 0; }
  .chat-bar textarea {
    flex: 1; border: 1px solid #e8e8e8; border-radius: 8px; resize: none; height: 44px;
    padding: 10px 12px; font-size: 14px; outline: none; font-family: inherit;
  }
  .chat-bar textarea:focus { border-color: #ff7a45; }
  .chat-bar button {
    align-self: flex-end; border: none; background: #ff7043; color: #fff;
    border-radius: 8px; padding: 0 26px; height: 44px; font-size: 14px; cursor: pointer;
  }
  .chat-bar button:disabled { background: #ffc7ae; cursor: not-allowed; }
  .chat-placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #bbb; font-size: 14px;
  }
</style>
</head>
<body>

<div id="login-mask">
  <div class="login-card">
    <h1>商家客服工作台</h1>
    <p>苍穹外卖 · 使用后台管理员账号登录</p>
    <input id="lg-username" placeholder="管理员账号" value="admin" autocomplete="username">
    <input id="lg-password" type="password" placeholder="密码" value="123456" autocomplete="current-password">
    <div class="login-err" id="lg-err"></div>
    <button id="lg-btn">登 录</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo">🏪 苍穹外卖客服<small>商家工作台</small></div>
    <div class="spacer"></div>
    <span class="conn-dot" id="conn-dot">已连接</span>
    <span class="emp-name" id="emp-name"></span>
    <button class="btn-logout" id="btn-logout">退出</button>
  </div>
  <div class="main">
    <div class="sider">
      <div class="sider-head">会话列表</div>
      <div class="conv-list" id="conv-list"></div>
    </div>
    <div class="chat" id="chat-panel">
      <div class="chat-placeholder" id="chat-empty">请选择左侧会话开始回复</div>
      <div class="chat-head hidden" id="chat-head"></div>
      <div class="chat-msgs hidden" id="chat-msgs"></div>
      <div class="chat-bar hidden" id="chat-bar">
        <textarea id="chat-input" placeholder="输入回复内容，Enter 发送（Shift+Enter 换行）" maxlength="500"></textarea>
        <button id="chat-send">发送</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var TOKEN_KEY = "sky_kefu_token";
  var EMP_KEY = "sky_kefu_emp";
  var STATUS_TEXT = { 1: "待付款", 2: "待接单", 3: "已接单", 4: "派送中", 5: "已完成", 6: "已取消" };

  var token = localStorage.getItem(TOKEN_KEY) || "";
  var emp = JSON.parse(localStorage.getItem(EMP_KEY) || "null");
  var conversations = [];
  var currentUser = null;   // 当前打开会话的 userId
  var messages = [];        // 当前会话消息
  var ws = null;
  var reconnectTimer = null;

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) { return (Number(n) || 0).toFixed(2); }
  function fmtTime(t) {
    if (!t) return "";
    var d = new Date(String(t).replace(/-/g, "/"));
    if (isNaN(d.getTime())) return String(t).slice(5, 16);
    var p = function (n) { return n < 10 ? "0" + n : n; };
    return (d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function api(method, url, body) {
    return fetch(url, {
      method: method,
      headers: { "token": token, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (r.status === 401) { logout(); throw new Error("登录已过期"); }
      return r.json();
    }).then(function (res) {
      if (res.code && res.code !== 1 && res.code !== 200) throw new Error(res.msg || "请求失败");
      return res.data;
    });
  }

  // ---------- 登录 ----------
  $("lg-btn").addEventListener("click", login);
  $("lg-password").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });

  function login() {
    var u = $("lg-username").value.trim();
    var p = $("lg-password").value.trim();
    $("lg-err").textContent = "";
    if (!u || !p) { $("lg-err").textContent = "请输入账号密码"; return; }
    fetch("/api/employee/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.code !== 1 && res.code !== 200) throw new Error(res.msg || "登录失败");
      token = res.data.token;
      emp = { id: res.data.id, name: res.data.name || res.data.userName || u };
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(EMP_KEY, JSON.stringify(emp));
      enterApp();
    }).catch(function (e) {
      $("lg-err").textContent = e.message || "登录失败";
    });
  }

  $("btn-logout").addEventListener("click", logout);
  function logout() {
    token = "";
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(EMP_KEY);
    closeWs();
    $("login-mask").classList.remove("hidden");
    $("app").classList.add("hidden");
  }

  // ---------- 进入工作台 ----------
  function enterApp() {
    $("login-mask").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("emp-name").textContent = emp ? (emp.name || "管理员") : "";
    connectWs();
    loadConversations();
    setInterval(loadConversations, 15000); // 兜底轮询
  }

  // ---------- WebSocket ----------
  function connectWs() {
    if (!token) return;
    var proto = location.protocol === "https:" ? "wss" : "ws";
    var url = proto + "://" + location.host + "/ws/chat?type=2&token=" + encodeURIComponent(token);
    var sock;
    try { sock = new WebSocket(url); } catch (e) { return; }
    ws = sock;
    sock.onopen = function () { setConn(true); };
    sock.onclose = function () {
      setConn(false);
      if (ws === sock) {
        reconnectTimer = setTimeout(connectWs, 3000);
      }
    };
    sock.onerror = function () { try { sock.close(); } catch (e) {} };
    sock.onmessage = function (ev) {
      var env;
      try { env = JSON.parse(ev.data); } catch (e) { return; }
      if (env.type === "msg" && env.message) {
        var m = env.message;
        if (m.senderType === 1) {
          //用户发来
          if (currentUser === m.userId) {
            messages.push(m);
            renderMessages();
            api("PUT", "/api/chat/read?userId=" + m.userId);
            patchConv(m.userId, { unreadCount: 0 });
          } else {
            upsertConvOnPush(m);
          }
        }
      } else if (env.type === "ack") {
        resolveAck(env.clientMsgId, env.message);
      }
      loadConversations(true);
    };
  }

  function closeWs() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (ws) {
      var s = ws; ws = null;
      s.onclose = s.onerror = s.onmessage = null;
      try { s.close(); } catch (e) {}
    }
  }
  function setConn(ok) { $("conn-dot").classList.toggle("offline", !ok); $("conn-dot").textContent = ok ? "已连接" : "连接中…"; }

  // ---------- 会话列表 ----------
  function loadConversations(silent) {
    if (!token) return;
    api("GET", "/api/chat/conversations").then(function (list) {
      conversations = list || [];
      renderConvList();
    }).catch(function (e) { if (!silent) console.warn(e); });
  }

  function convPreview(c) {
    return c.lastMsgType === 2 ? "[订单卡片]" : esc(c.lastContent || "");
  }

  function renderConvList() {
    var box = $("conv-list");
    if (!conversations.length) {
      box.innerHTML = '<div class="sider-empty">暂无用户咨询</div>';
      return;
    }
    box.innerHTML = conversations.map(function (c) {
      var name = c.userName || c.username || ("用户" + c.userId);
      return '<div class="conv' + (currentUser === c.userId ? " active" : "") + '" data-uid="' + c.userId + '">'
        + '<div class="conv-avatar">👤</div>'
        + '<div class="conv-main"><div class="conv-line1"><span class="conv-name">' + esc(name) + '</span>'
        + '<span class="conv-time">' + esc(fmtTime(c.lastTime)) + '</span></div>'
        + '<div class="conv-line2"><span class="conv-last">' + convPreview(c) + '</span>'
        + (c.unreadCount ? '<span class="conv-badge">' + (c.unreadCount > 99 ? "99+" : c.unreadCount) + '</span>' : "")
        + "</div></div></div>";
    }).join("");
    box.querySelectorAll(".conv").forEach(function (el) {
      el.addEventListener("click", function () { openConversation(Number(el.dataset.uid)); });
    });
  }

  function upsertConvOnPush(m) {
    var found = conversations.find(function (c) { return c.userId === m.userId; });
    if (found) {
      found.lastMsgType = m.msgType;
      found.lastContent = m.content;
      found.lastTime = m.createTime;
      found.unreadCount = (found.unreadCount || 0) + 1;
    }
    // 精确排序由下一次 loadConversations 完成
  }
  function patchConv(uid, patch) {
    var c = conversations.find(function (x) { return x.userId === uid; });
    if (c) Object.assign(c, patch);
  }

  // ---------- 聊天窗 ----------
  function openConversation(uid) {
    currentUser = uid;
    renderConvList();
    $("chat-empty").classList.add("hidden");
    ["chat-head", "chat-msgs", "chat-bar"].forEach(function (id) { $(id).classList.remove("hidden"); });
    var c = conversations.find(function (x) { return x.userId === uid; });
    $("chat-head").innerHTML = esc(c ? (c.userName || c.username || ("用户" + uid)) : ("用户" + uid))
      + "<small>userId: " + uid + "</small>";
    $("chat-msgs").innerHTML = '<div class="chat-tip">加载中…</div>';
    api("GET", "/api/chat/history?userId=" + uid).then(function (list) {
      if (currentUser !== uid) return;
      messages = list || [];
      renderMessages();
      return api("PUT", "/api/chat/read?userId=" + uid);
    }).then(function () {
      patchConv(uid, { unreadCount: 0 });
      renderConvList();
    }).catch(function (e) {
      if (currentUser === uid) $("chat-msgs").innerHTML = '<div class="chat-tip">' + esc(e.message) + "</div>";
    });
  }

  function bubbleHtml(m) {
    var mine = m.senderType === 2;
    var cmid = m.clientMsgId ? ' data-cmid="' + esc(m.clientMsgId) + '"' : "";
    var body;
    if (m.msgType === 2) {
      var s = {};
      try { s = JSON.parse(m.content || "{}"); } catch (e) {}
      body = '<div class="order-card"><div class="oc-h">🧾 订单卡片' + (m.sending ? "（发送中）" : "") + "</div>"
        + '<div class="oc-n">' + esc(s.number || "") + "</div>"
        + '<div class="oc-f"><span>' + esc(STATUS_TEXT[s.status] || "未知状态") + '</span><b>￥' + money(s.amount) + "</b></div></div>";
    } else {
      body = '<div class="bubble' + (m.sending ? " sending" : "") + '">' + esc(m.content) + "</div>";
    }
    return '<div class="msg-row ' + (mine ? "me" : "other") + '"' + cmid + '>'
      + (mine ? "" : '<div class="msg-ava">' + (m.senderType === 3 ? "🤖" : "👤") + "</div>")
      + '<div class="msg-col">' + (m.createTime ? '<div class="msg-time">' + esc(fmtTime(m.createTime)) + "</div>" : "")
      + body + "</div></div>";
  }

  function renderMessages() {
    var box = $("chat-msgs");
    box.innerHTML = messages.length ? messages.map(bubbleHtml).join("") : '<div class="chat-tip">暂无消息</div>';
    box.scrollTop = box.scrollHeight;
  }

  function sendText() {
    var input = $("chat-input");
    var text = input.value.trim();
    if (!text || currentUser == null) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) { alert("连接中，请稍后再试"); return; }
    var clientMsgId = "k" + Date.now() + Math.floor(Math.random() * 1000);
    messages.push({ clientMsgId: clientMsgId, senderType: 2, msgType: 1, content: text, sending: true });
    renderMessages();
    ws.send(JSON.stringify({ clientMsgId: clientMsgId, msgType: 1, content: text, toUser: currentUser }));
    input.value = "";
  }

  function resolveAck(clientMsgId, saved) {
    if (!clientMsgId) return;
    var idx = messages.findIndex(function (m) { return m.clientMsgId === clientMsgId; });
    if (idx >= 0) { messages[idx] = saved; renderMessages(); }
  }

  $("chat-send").addEventListener("click", sendText);
  $("chat-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); }
  });

  // 已登录则直接进入
  if (token && emp) enterApp();
})();
</script>
</body>
</html>
